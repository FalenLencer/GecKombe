<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUAD // Robot Control</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #080c10;
    --surface:  #0d1520;
    --border:   #1a2a3a;
    --accent:   #00d4ff;
    --accent2:  #ff6b00;
    --green:    #00ff88;
    --red:      #ff3366;
    --text:     #c8dce8;
    --dim:      #3a5570;
    --warn:     #ffbb00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,255,.015) 2px, rgba(0,212,255,.015) 4px);
    pointer-events: none;
    z-index: 0;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 2rem;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 1.4rem;
    letter-spacing: .2em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,212,255,.4);
  }
  .logo span { color: var(--accent2); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    font-size: .72rem;
    letter-spacing: .1em;
    color: var(--dim);
  }

  .status-dot { display: flex; align-items: center; gap: .4rem; }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    transition: background .3s;
  }
  .dot.connected { background: var(--green); animation: pulse-dot 2s infinite; }
  @keyframes pulse-dot { 0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,.4)} 50%{box-shadow:0 0 0 5px rgba(0,255,136,0)} }

  #ws-status { transition: color .3s; }
  #ws-status.connected { color: var(--green); }

  main {
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto auto auto;
    gap: 1.2rem;
    padding: 1.2rem 2rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: .4;
  }

  .panel-label {
    font-size: .65rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .panel-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── Camera view ── */
  .camera-view {
    grid-column: 1;
    grid-row: 1 / 3;
  }

  .cam-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
  }

  .cam-status-pill {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .65rem;
    letter-spacing: .1em;
    padding: .25rem .6rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--dim);
    transition: all .3s;
  }
  .cam-status-pill.streaming {
    border-color: rgba(0,255,136,.4);
    color: var(--green);
    background: rgba(0,255,136,.07);
  }
  .cam-status-pill.error {
    border-color: rgba(255,51,102,.4);
    color: var(--red);
    background: rgba(255,51,102,.07);
  }
  .cam-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .cam-status-pill.streaming .cam-dot { animation: pulse-dot 1.5s infinite; }

  /* Conteneur vidéo */
  .cam-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  /* Overlay corner brackets */
  .cam-viewport::before,
  .cam-viewport::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--accent);
    border-style: solid;
    opacity: .6;
    z-index: 2;
    pointer-events: none;
  }
  .cam-viewport::before {
    top: 8px; left: 8px;
    border-width: 2px 0 0 2px;
  }
  .cam-viewport::after {
    bottom: 8px; right: 8px;
    border-width: 0 2px 2px 0;
  }

  .cam-corner-br {
    position: absolute;
    bottom: 8px; left: 8px;
    width: 20px; height: 20px;
    border: 2px solid var(--accent);
    border-top: none; border-right: none;
    opacity: .6;
    z-index: 2;
    pointer-events: none;
  }
  .cam-corner-tr {
    position: absolute;
    top: 8px; right: 8px;
    width: 20px; height: 20px;
    border: 2px solid var(--accent);
    border-bottom: none; border-left: none;
    opacity: .6;
    z-index: 2;
    pointer-events: none;
  }

  /* REC badge */
  .rec-badge {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: .35rem;
    font-family: 'Orbitron', monospace;
    font-size: .6rem;
    letter-spacing: .2em;
    color: var(--red);
    opacity: 0;
    transition: opacity .3s;
    z-index: 3;
    pointer-events: none;
  }
  .rec-badge.visible { opacity: 1; }
  .rec-badge .rec-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--red);
    animation: blink .8s infinite alternate;
  }

  /* OSD bas */
  .cam-osd {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: .5rem .8rem;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    font-size: .62rem;
    letter-spacing: .1em;
    color: rgba(200,220,232,.6);
    z-index: 3;
    pointer-events: none;
  }
  #osd-cmd {
    font-family: 'Orbitron', monospace;
    font-size: .65rem;
    color: var(--accent);
    letter-spacing: .15em;
    transition: color .3s;
  }
  #osd-cmd.stop { color: var(--red); }

  /* Image stream */
  #cam-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity .5s;
  }
  #cam-img.visible { opacity: 1; }

  /* Placeholder quand pas de flux */
  .cam-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .8rem;
    color: var(--dim);
    font-size: .72rem;
    letter-spacing: .12em;
    transition: opacity .4s;
  }
  .cam-placeholder svg { opacity: .25; }
  .cam-placeholder.hidden { opacity: 0; pointer-events: none; }

  /* Barre infos caméra */
  .cam-info-bar {
    display: flex;
    gap: 1.2rem;
    margin-top: .8rem;
    font-size: .65rem;
    color: var(--dim);
    letter-spacing: .1em;
    flex-wrap: wrap;
  }
  .cam-info-bar span { display: flex; align-items: center; gap: .3rem; }
  .cam-info-bar strong { color: var(--text); }

  /* Conn row caméra */
  .cam-conn-row {
    display: flex;
    gap: .6rem;
    align-items: center;
    margin-top: .8rem;
  }

  /* ── Controls ── */
  .controls-panel { grid-column: 2; grid-row: 1; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 6px;
    margin: .5rem auto;
    width: fit-content;
  }

  .btn {
    background: var(--border);
    border: 1px solid var(--dim);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    transition: all .1s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,.08); }
  .btn.pressed {
    background: rgba(0,212,255,.2);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(0,212,255,.3);
    transform: scale(.94);
  }
  .btn.empty { background: transparent; border: none; cursor: default; }
  .btn.stop {
    background: rgba(255,51,102,.1);
    border-color: var(--red);
    color: var(--red);
    font-size: .8rem;
    letter-spacing: .1em;
    font-family: 'Orbitron', monospace;
  }
  .btn.stop:hover { background: rgba(255,51,102,.2); box-shadow: 0 0 12px rgba(255,51,102,.3); }

  .speed-row {
    margin-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .speed-label {
    display: flex;
    justify-content: space-between;
    font-size: .7rem;
    color: var(--dim);
    letter-spacing: .1em;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

  /* Connexion QuadBot */
  .conn-row {
    display: flex;
    gap: .6rem;
    align-items: center;
    margin-bottom: 1rem;
  }
  .conn-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: .78rem;
    padding: .4rem .7rem;
    outline: none;
    transition: border-color .2s;
  }
  .conn-input:focus { border-color: var(--accent); }
  .conn-btn {
    background: rgba(0,212,255,.1);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: .72rem;
    letter-spacing: .1em;
    padding: .4rem .9rem;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .conn-btn:hover { background: rgba(0,212,255,.2); }

  /* ── Sensor panel ── */
  .sensor-panel { grid-column: 2; grid-row: 2; }

  .metric { display: flex; flex-direction: column; gap: .2rem; margin-bottom: 1rem; }
  .metric-row { display: flex; justify-content: space-between; align-items: baseline; }
  .metric-name { font-size: .65rem; letter-spacing: .15em; color: var(--dim); text-transform: uppercase; }
  .metric-val {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    transition: color .3s;
  }
  .metric-val.warn { color: var(--warn); }
  .metric-val.danger { color: var(--red); animation: blink .6s infinite alternate; }
  @keyframes blink { from{opacity:1} to{opacity:.4} }
  .metric-unit { font-size: .7rem; color: var(--dim); }

  .bar-track { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--green), var(--accent), var(--accent2), var(--red));
    background-size: 400% 100%;
    transition: width .5s ease;
  }

  .divider { height: 1px; background: var(--border); margin: .8rem 0; }

  .alert-badge {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .3rem .7rem;
    border-radius: 4px;
    font-size: .65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: rgba(0,255,136,.1);
    border: 1px solid rgba(0,255,136,.3);
    color: var(--green);
    transition: all .3s;
  }
  .alert-badge.danger {
    background: rgba(255,51,102,.15);
    border-color: rgba(255,51,102,.4);
    color: var(--red);
    animation: blink .6s infinite alternate;
  }

  /* ── Log ── */
  .log-panel { grid-column: 1; grid-row: 3; }

  #log {
    font-size: .72rem;
    color: var(--dim);
    line-height: 1.8;
    max-height: 80px;
    overflow-y: auto;
    letter-spacing: .05em;
  }
  #log .entry { color: var(--text); }
  #log .entry.cmd { color: var(--accent); }
  #log .entry.warn { color: var(--warn); }
  #log .entry.err { color: var(--red); }
  #log .entry.cam { color: var(--accent2); }

  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; }
    .camera-view   { grid-column: 1; grid-row: 1; }
    .controls-panel { grid-column: 1; grid-row: 2; }
    .sensor-panel  { grid-column: 1; grid-row: 3; }
    .log-panel     { grid-column: 1; grid-row: 4; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">QUAD<span>/</span>BOT</div>
  <div class="status-bar">
    <div class="status-dot">
      <div class="dot" id="dot"></div>
      <span id="ws-status">DÉCONNECTÉ</span>
    </div>
    <span id="latency" style="color:var(--dim)">— ms</span>
  </div>
</header>

<main>

  <!-- ── Flux caméra ── -->
  <div class="panel camera-view">
    <div class="cam-header">
      <div class="panel-label" style="margin-bottom:0">Flux caméra</div>
      <div class="cam-status-pill" id="cam-pill">
        <span class="cam-dot"></span>
        <span id="cam-pill-text">HORS LIGNE</span>
      </div>
    </div>

    <!-- IP de la caméra -->
    <div class="cam-conn-row" style="margin-bottom:.8rem">
      <input class="conn-input" id="cam-ip" type="text"
             value="192.168.83.150:81" placeholder="IP ESP32-CAM :81"/>
      <button class="conn-btn" onclick="connectCam()">STREAM</button>
      <button class="conn-btn" style="border-color:var(--dim);color:var(--dim)" onclick="stopCam()">■</button>
    </div>

    <!-- Viewport vidéo -->
    <div class="cam-viewport" id="cam-viewport">
      <div class="cam-corner-br"></div>
      <div class="cam-corner-tr"></div>

      <div class="rec-badge" id="rec-badge">
        <span class="rec-dot"></span>LIVE
      </div>

      <!-- Placeholder -->
      <div class="cam-placeholder" id="cam-placeholder">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="14" width="44" height="36" rx="4" stroke="#00d4ff" stroke-width="2"/>
          <path d="M48 26l12-8v28l-12-8V26z" stroke="#00d4ff" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="26" cy="32" r="8" stroke="#00d4ff" stroke-width="1.5"/>
          <circle cx="26" cy="32" r="3" fill="#00d4ff" opacity=".3"/>
        </svg>
        <span>Entrez l'IP de l'ESP32-CAM</span>
        <span style="font-size:.6rem;opacity:.5">http://IP:81/stream</span>
      </div>

      <!-- Image MJPEG -->
      <img id="cam-img" src="" alt="flux caméra"/>

      <!-- OSD -->
      <div class="cam-osd">
        <span id="osd-cmd">EN ATTENTE</span>
        <span id="osd-res">—</span>
      </div>
    </div>

    <!-- Infos caméra -->
    <div class="cam-info-bar">
      <span>RES <strong id="info-res">—</strong></span>
      <span>FPS <strong id="info-fps">—</strong></span>
      <span>QUALITÉ <strong id="info-quality">—</strong></span>

      <!-- Contrôles rapides -->
      <span style="margin-left:auto;gap:.6rem;display:flex">
        <button class="conn-btn" style="font-size:.6rem;padding:.2rem .5rem"
          onclick="camControl('vflip',   camFlip=!camFlip?1:0)">↕ FLIP</button>
        <button class="conn-btn" style="font-size:.6rem;padding:.2rem .5rem"
          onclick="camControl('hmirror', camMirror=!camMirror?1:0)">↔ MIROIR</button>
        <button class="conn-btn" style="font-size:.6rem;padding:.2rem .5rem;border-color:var(--warn);color:var(--warn)"
          onclick="toggleFlash()">⚡ FLASH</button>
      </span>
    </div>
  </div>

  <!-- ── Contrôles QuadBot ── -->
  <div class="panel controls-panel">
    <div class="panel-label">Contrôle robot</div>
    <div class="conn-row">
      <input class="conn-input" id="ip-input" type="text"
             value="192.168.83.149:81" placeholder="IP ESP32"/>
      <button class="conn-btn" onclick="connect()">CONN.</button>
    </div>

    <div class="dpad">
      <div class="btn empty"></div>
      <div class="btn" id="btn-forward"  data-cmd="forward">&#9650;</div>
      <div class="btn empty"></div>
      <div class="btn" id="btn-left"     data-cmd="left">&#9664;</div>
      <div class="btn stop" id="btn-stop" data-cmd="stop">STOP</div>
      <div class="btn" id="btn-right"    data-cmd="right">&#9654;</div>
      <div class="btn empty"></div>
      <div class="btn" id="btn-backward" data-cmd="backward">&#9660;</div>
      <div class="btn empty"></div>
    </div>

    <div class="speed-row">
      <div class="speed-label">
        <span>VITESSE</span>
        <span id="speed-val">50%</span>
      </div>
      <input type="range" id="speed" min="0" max="100" value="50"
        oninput="document.getElementById('speed-val').textContent=this.value+'%'">
    </div>
  </div>

  <!-- ── Capteur MQ-9 ── -->
  <div class="panel sensor-panel">
    <div class="panel-label">Capteur MQ-9</div>

    <div class="metric">
      <div class="metric-row">
        <span class="metric-name">CO estimé</span>
        <span class="metric-unit">ppm</span>
      </div>
      <div class="metric-val" id="ppm">—</div>
      <div class="bar-track"><div class="bar-fill" id="ppm-bar" style="width:0%"></div></div>
    </div>

    <div class="divider"></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem">
      <div class="metric">
        <div class="metric-name">Brut ADC</div>
        <div class="metric-val" style="font-size:1rem" id="raw">—</div>
      </div>
      <div class="metric">
        <div class="metric-name">Tension</div>
        <div class="metric-val" style="font-size:1rem" id="voltage">—<span class="metric-unit" style="font-size:.65rem">V</span></div>
      </div>
    </div>

    <div class="divider"></div>

    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:.65rem;letter-spacing:.12em;color:var(--dim)">SEUIL DIGITAL</span>
      <div class="alert-badge" id="alert-badge">
        <span id="alert-dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block"></span>
        <span id="alert-text">NORMAL</span>
      </div>
    </div>
  </div>

  <!-- ── Log ── -->
  <div class="panel log-panel" style="grid-column:1;grid-row:3">
    <div class="panel-label">Journaux</div>
    <div id="log"></div>
  </div>

</main>

<script>
  // ══════════════════════════════════════════════════════════
  //  CONFIG
  // ══════════════════════════════════════════════════════════
  const MAX_PPM    = 1000;
  const WARN_PPM   = 200;
  const DANGER_PPM = 500;

  // ══════════════════════════════════════════════════════════
  //  WEBSOCKET (QuadBot)
  // ══════════════════════════════════════════════════════════
  let ws           = null;
  let pingInterval = null;
  let pingTime     = 0;
  let currentCmd   = null;
  let sendInterval = null;

  function connect() {
    const ip = document.getElementById('ip-input').value.trim();
    if (ws) ws.close();
    log(`Connexion à ws://${ip}/ws ...`, 'entry');
    ws = new WebSocket(`ws://${ip}/ws`);

    ws.onopen = () => {
      setStatus(true);
      log('WebSocket connecté', 'entry');
      pingInterval = setInterval(sendPing, 2000);
    };
    ws.onclose = () => {
      setStatus(false);
      clearInterval(pingInterval);
      clearInterval(sendInterval);
      log('WebSocket déconnecté', 'err');
    };
    ws.onerror = () => log('Erreur WebSocket', 'err');
    ws.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.type === 'pong') {
          document.getElementById('latency').textContent = (Date.now() - pingTime) + ' ms';
          return;
        }
        if (d.type === 'sensor') updateSensors(d);
      } catch(_) {}
    };
  }

  function sendPing() {
    if (ws?.readyState === 1) {
      pingTime = Date.now();
      ws.send(JSON.stringify({ type: 'ping' }));
    }
  }

  function sendCmd(cmd) {
    if (ws?.readyState !== 1) { log('Non connecté', 'warn'); return; }
    const speed = parseInt(document.getElementById('speed').value);
    ws.send(JSON.stringify({ type: 'cmd', cmd, speed }));
    log(`> CMD ${cmd.toUpperCase()} speed=${speed}`, 'cmd');
  }

  function setStatus(ok) {
    document.getElementById('dot').className         = 'dot' + (ok ? ' connected' : '');
    document.getElementById('ws-status').textContent = ok ? 'CONNECTÉ' : 'DÉCONNECTÉ';
    document.getElementById('ws-status').className   = ok ? 'connected' : '';
    if (!ok) document.getElementById('latency').textContent = '— ms';
  }

  // ══════════════════════════════════════════════════════════
  //  CAMÉRA ESP32-CAM
  // ══════════════════════════════════════════════════════════
  let camBaseUrl  = '';   // http://IP (sans port ni slash final)
  let camStreaming = false;
  let camFlip     = 0;
  let camMirror   = 0;
  let camFlashOn  = false;
  let fpsTimer    = null;
  let fpsCount    = 0;

  function connectCam() {
    const raw = document.getElementById('cam-ip').value.trim();
    // Sépare host:port → base URL sur port 80, stream sur le port indiqué
    const [host, streamPort] = raw.includes(':')
      ? raw.split(':')
      : [raw, '81'];

    camBaseUrl = `http://${host}`;          // port 80 pour /control, /status
    const streamUrl = `http://${host}:${streamPort}/stream`;

    log(`CAM → ${streamUrl}`, 'cam');
    const img = document.getElementById('cam-img');

    // Récupère le status caméra (résolution, qualité…)
    fetchCamStatus(camBaseUrl);

    // Lance le stream MJPEG
    img.src = '';
    img.onload = null;

    // Premier frame → considéré comme streamant
    let firstFrame = true;
    img.onload = () => {
      if (firstFrame) {
        firstFrame = false;
        setCamState('streaming');
        startFpsCounter();
      }
      fpsCount++;
    };
    img.onerror = () => {
      setCamState('error');
      log('CAM — impossible de charger le flux', 'err');
    };

    img.src = streamUrl;
    camStreaming = true;
  }

  function stopCam() {
    const img = document.getElementById('cam-img');
    img.src = '';
    camStreaming = false;
    setCamState('offline');
    stopFpsCounter();
    log('CAM — flux arrêté', 'cam');
  }

  function setCamState(state) {
    const pill  = document.getElementById('cam-pill');
    const txt   = document.getElementById('cam-pill-text');
    const ph    = document.getElementById('cam-placeholder');
    const img   = document.getElementById('cam-img');
    const rec   = document.getElementById('rec-badge');

    pill.className = 'cam-status-pill';
    img.classList.remove('visible');
    ph.classList.remove('hidden');
    rec.classList.remove('visible');

    if (state === 'streaming') {
      pill.classList.add('streaming');
      txt.textContent = 'EN DIRECT';
      img.classList.add('visible');
      ph.classList.add('hidden');
      rec.classList.add('visible');
    } else if (state === 'error') {
      pill.classList.add('error');
      txt.textContent = 'ERREUR';
    } else {
      txt.textContent = 'HORS LIGNE';
    }
  }

  async function fetchCamStatus(base) {
    try {
      const r = await fetch(`${base}/status`, { signal: AbortSignal.timeout(3000) });
      const d = await r.json();
      const sizes = ['96x96','160x120','176x144','240x176','240x240',
                     '320x240','400x296','480x272','640x480','800x600',
                     '1024x768','1280x1024','1600x1200'];
      document.getElementById('info-res').textContent     = sizes[d.framesize] || '—';
      document.getElementById('info-quality').textContent = d.quality;
      document.getElementById('osd-res').textContent      = sizes[d.framesize] || '—';
    } catch(_) {}
  }

  function camControl(variable, value) {
    if (!camBaseUrl) { log('CAM non connectée', 'warn'); return; }
    const url = `${camBaseUrl}/control?var=${variable}&val=${value}`;
    fetch(url).catch(() => log(`CAM contrôle échoué : ${variable}`, 'err'));
    log(`CAM ${variable}=${value}`, 'cam');
  }

  function toggleFlash() {
    camFlashOn = !camFlashOn;
    camControl('flash', camFlashOn ? 1 : 0);
  }

  // Compteur FPS (frames par seconde)
  function startFpsCounter() {
    stopFpsCounter();
    fpsCount = 0;
    fpsTimer = setInterval(() => {
      document.getElementById('info-fps').textContent = fpsCount;
      fpsCount = 0;
    }, 1000);
  }
  function stopFpsCounter() {
    if (fpsTimer) { clearInterval(fpsTimer); fpsTimer = null; }
    document.getElementById('info-fps').textContent = '—';
  }

  // ══════════════════════════════════════════════════════════
  //  CAPTEUR MQ-9
  // ══════════════════════════════════════════════════════════
  function updateSensors(d) {
    const ppmEl = document.getElementById('ppm');
    const ppm   = parseFloat(d.ppm) || 0;

    document.getElementById('raw').textContent     = d.raw ?? '—';
    document.getElementById('voltage').textContent = d.voltage
      ? parseFloat(d.voltage).toFixed(2) : '—';
    ppmEl.textContent = ppm.toFixed(1);

    const pct = Math.min(ppm / MAX_PPM * 100, 100);
    document.getElementById('ppm-bar').style.width = pct + '%';

    if (ppm >= DANGER_PPM)    ppmEl.className = 'metric-val danger';
    else if (ppm >= WARN_PPM) ppmEl.className = 'metric-val warn';
    else                      ppmEl.className = 'metric-val';

    const badge = document.getElementById('alert-badge');
    const txt   = document.getElementById('alert-text');
    if (d.alert) {
      badge.className = 'alert-badge danger';
      txt.textContent = 'ALERTE GAZ';
    } else {
      badge.className = 'alert-badge';
      txt.textContent = 'NORMAL';
    }
  }

  // ══════════════════════════════════════════════════════════
  //  D-PAD + KEYBOARD
  // ══════════════════════════════════════════════════════════
  // Synchro OSD commande sur la vidéo
  function setOsdCmd(cmd) {
    const el = document.getElementById('osd-cmd');
    if (cmd === 'stop' || !cmd) {
      el.textContent = 'EN ATTENTE';
      el.className   = '';
    } else {
      el.textContent = cmd.toUpperCase();
      el.className   = '';
    }
  }

  function startCmd(cmd, el) {
    if (currentCmd === cmd) return;
    stopCmd();
    currentCmd = cmd;
    el.classList.add('pressed');
    setOsdCmd(cmd);
    sendCmd(cmd);
    if (cmd !== 'stop') sendInterval = setInterval(() => sendCmd(cmd), 150);
  }

  function stopCmd() {
    if (!currentCmd || currentCmd === 'stop') return;
    clearInterval(sendInterval);
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('pressed'));
    setOsdCmd(null);
    currentCmd = null;
    sendCmd('stop');
  }

  document.querySelectorAll('.btn[data-cmd]').forEach(btn => {
    const cmd = btn.dataset.cmd;
    btn.addEventListener('mousedown',  e => { e.preventDefault(); startCmd(cmd, btn); });
    btn.addEventListener('touchstart', e => { e.preventDefault(); startCmd(cmd, btn); }, { passive: false });
    if (cmd !== 'stop') {
      btn.addEventListener('mouseup',    () => stopCmd());
      btn.addEventListener('mouseleave', () => stopCmd());
      btn.addEventListener('touchend',   () => stopCmd());
    }
  });

  const KEY_CMD = {
    ArrowUp:'forward', ArrowDown:'backward',
    ArrowLeft:'left',  ArrowRight:'right', ' ':'stop'
  };
  document.addEventListener('keydown', e => {
    const cmd = KEY_CMD[e.key];
    if (!cmd) return;
    e.preventDefault();
    const btn = document.querySelector(`.btn[data-cmd="${cmd}"]`);
    if (btn) startCmd(cmd, btn);
  });
  document.addEventListener('keyup', e => {
    const cmd = KEY_CMD[e.key];
    if (cmd && cmd !== 'stop') stopCmd();
  });

  // ══════════════════════════════════════════════════════════
  //  LOG
  // ══════════════════════════════════════════════════════════
  function log(msg, cls = 'entry') {
    const el  = document.getElementById('log');
    const now = new Date().toLocaleTimeString('fr-FR');
    el.innerHTML += `<div class="entry ${cls}">[${now}] ${msg}</div>`;
    el.scrollTop  = el.scrollHeight;
    while (el.children.length > 40) el.removeChild(el.firstChild);
  }

  log('Dashboard v2 initialisé — connecte le robot et la caméra séparément.', 'entry');
</script>
